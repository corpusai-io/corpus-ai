service: corpus-lambda-integrations

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-west-2'}
  stage: ${opt:stage, 'dev'}
  timeout: 60
  memorySize: 512
  architecture: x86_64

  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--enable-source-maps'

    # AWS Configuration
    AWS_REGION: ${env:AWS_REGION}

    # DynamoDB Tables
    AWS_DYNAMO_CHATBOT_TABLE: ${env:AWS_DYNAMO_CHATBOT_TABLE}
    AWS_DYNAMO_USER_TABLE: ${env:AWS_DYNAMO_USER_TABLE}
    AWS_DYNAMO_QUERY_LOG_TABLE: ${env:AWS_DYNAMO_QUERY_LOG_TABLE}
    AWS_DYNAMO_INTEGRATIONS_TABLE: ${env:AWS_DYNAMO_INTEGRATIONS_TABLE}

    # OpenAI
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    OPENAI_MODEL: ${env:OPENAI_MODEL}

    # Pinecone
    PINECONE_API_KEY: ${env:PINECONE_API_KEY}
    PINECONE_ENVIRONMENT: ${env:PINECONE_ENVIRONMENT, 'us-east-1'}

    # WhatsApp
    WHATSAPP_VERIFY_TOKEN: ${env:WHATSAPP_VERIFY_TOKEN, 'corpus-ai-verify-token'}
    WHATSAPP_ACCESS_TOKEN: ${env:WHATSAPP_ACCESS_TOKEN, ''}

    # Telegram
    TELEGRAM_BOT_TOKEN: ${env:TELEGRAM_BOT_TOKEN, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:AWS_DYNAMO_CHATBOT_TABLE}
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:AWS_DYNAMO_USER_TABLE}
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:AWS_DYNAMO_QUERY_LOG_TABLE}
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:AWS_DYNAMO_INTEGRATIONS_TABLE}

functions:
  whatsappHandler:
    handler: src/handlers/whatsapp.handler
    description: Handle WhatsApp Business API webhooks
    events:
      - http:
          path: whatsapp/webhook
          method: get # Verification
          cors: true
      - http:
          path: whatsapp/webhook
          method: post # Messages
          cors: true

  telegramHandler:
    handler: src/handlers/telegram.handler
    description: Handle Telegram Bot API webhooks
    events:
      - http:
          path: telegram/webhook
          method: post
          cors: true

plugins:
  - serverless-plugin-typescript
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 8006
