service: corpus-lambda-slack

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-west-2'}
  stage: ${opt:stage, 'dev'}
  timeout: 300 # 5 minutes
  memorySize: 1024
  architecture: x86_64

  environment:
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    NODE_OPTIONS: '--enable-source-maps'

    # AWS Configuration
    AWS_REGION: ${env:AWS_REGION}

    # DynamoDB Tables
    AWS_DYNAMO_CHATBOT_TABLE: ${env:AWS_DYNAMO_CHATBOT_TABLE}
    AWS_DYNAMO_USER_TABLE: ${env:AWS_DYNAMO_USER_TABLE}
    AWS_DYNAMO_QUERY_LOG_TABLE: ${env:AWS_DYNAMO_QUERY_LOG_TABLE}
    AWS_DYNAMO_INTEGRATIONS_TABLE: ${env:AWS_DYNAMO_INTEGRATIONS_TABLE}

    # OpenAI
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    OPENAI_MODEL: ${env:OPENAI_MODEL}
    OPENAI_EMBEDDING_MODEL: ${env:OPENAI_EMBEDDING_MODEL, 'text-embedding-3-small'}

    # Pinecone
    PINECONE_API_KEY: ${env:PINECONE_API_KEY}
    PINECONE_ENVIRONMENT: ${env:PINECONE_ENVIRONMENT, 'us-east-1'}
    PINECONE_REGION: ${env:PINECONE_REGION, 'us-east-1'}

    # Slack
    SLACK_SIGNING_SECRET: ${env:SLACK_SIGNING_SECRET, ''}
    SLACK_BOT_TOKEN: ${env:SLACK_BOT_TOKEN, ''}

  iam:
    role:
      statements:
        # DynamoDB permissions
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:AWS_DYNAMO_CHATBOT_TABLE}
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:AWS_DYNAMO_USER_TABLE}
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:AWS_DYNAMO_QUERY_LOG_TABLE}
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:AWS_DYNAMO_INTEGRATIONS_TABLE}

functions:
  slackHandler:
    handler: src/index.handler
    description: Handle Slack bot events and messages
    events:
      - http:
          path: slack/events
          method: post
          cors: true

  slackOAuth:
    handler: src/oauth.handler
    description: Handle Slack OAuth callback
    events:
      - http:
          path: slack/oauth
          method: get
          cors: true

plugins:
  - serverless-plugin-typescript
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 8005
