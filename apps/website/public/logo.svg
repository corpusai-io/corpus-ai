<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 46" fill="none">
  <!-- Emblem (scaled from 64-unit source space to 46px) -->
  <g transform="scale(0.71875)">
    <path d="M 50 18 A 22 22 0 1 0 50 46" stroke="#0B0D10" stroke-width="7" stroke-linecap="square" fill="none"/>
    <path d="M 42 24 L 56 32 L 42 40 Z" fill="#5B6CE7"/>
  </g>

  <!-- Wordmark: CORPUS (Inter Tight 600) + AI (Inter Tight 400) -->
  <text x="60" y="23"
        font-family="'Inter Tight', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="30"
        letter-spacing="-1.2"
        dominant-baseline="central">
    <tspan font-weight="600" fill="#0B0D10">CORPUS</tspan><tspan font-weight="400" fill="#6B6F76">&#160;AI</tspan>
  </text>
</svg>
